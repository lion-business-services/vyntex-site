# Temporary visual QA for the day/night work. Lives only on feature branches;
# removed before merging to main.
name: visual-qa
on:
  push:
    branches: ["feature/day-night-v2"]
permissions:
  contents: write
concurrency: { group: visual-qa, cancel-in-progress: true }
jobs:
  shots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: (npm start -- -p 3000 > /tmp/start.log 2>&1 &) && sleep 6
      - run: cd .github/qa && npm init -y >/dev/null && npm i playwright@1.56.1 sharp axe-core --no-audit --no-fund && npx playwright install --with-deps chromium
      - run: mkdir -p /tmp/shots && cd .github/qa && node shots.mjs | tee /tmp/shots/report.txt || true
      - name: Publish shots to qa-shots branch
        run: |
          cd /tmp/shots
          git init -q && git checkout -q -b qa-shots
          git config user.name qa-bot && git config user.email qa-bot@users.noreply.github.com
          echo "${GITHUB_SHA}" > SHA.txt
          git add -A && git commit -qm "shots ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" qa-shots
